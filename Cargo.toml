[package]
name = "quran-detect-cli"
version = "0.1.0"
description = "Command-line detection and canonical restoration of Quran quotations in Arabic text."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true
categories = ["command-line-utilities", "text-processing"]
include = ["src/**", "Cargo.toml", "README.md", "LICENSE"]

[[bin]]
name = "quran-detect"
path = "src/main.rs"
doc = false

[dependencies]
anyhow.workspace = true
quran-detect = { path = "crates/quran-detect", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
usage-rs = { workspace = true, features = ["completions", "response-files"] }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
usage-rs = { workspace = true, features = ["test"] }

[lints]
workspace = true

[workspace]
resolver = "3"
members = ["crates/quran-detect"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/ieasybooks/quran-detect-rs"
keywords = ["arabic", "quran", "detection", "text-processing", "tanzil"]

[workspace.dependencies]
anyhow = "1.0.104"
quick-xml = "0.41.0"
serde = { version = "1.0.229", features = ["derive"] }
# Correctly rounded float parsing, so matches read back from JSON keep their exact values.
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-normalization = "0.1.26"
usage-rs = "7.1.2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
