name: Release binaries

# Builds `quran-detect` for each platform and attaches the archives to the GitHub release.
# Manual runs keep artifacts only, unless publishing is explicitly enabled on a release tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Attach archives to this tag's GitHub release
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The notices cover every target (about.toml does not filter by target), so they are generated once.
  notices:
    name: Generate dependency notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5.2.7
        with:
          install_args: rust cargo-binstall cargo:cargo-about
      - run: cargo about generate --locked --all-features --workspace --fail about.hbs --output-file THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@v7
        with:
          name: notices
          path: THIRD-PARTY-LICENSES.txt
          if-no-files-found: error

  build:
    name: Build ${{ matrix.target }}
    needs: notices
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement low (2.35).
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-pc-windows-msvc
            os: windows-2025
    defaults:
      run:
        shell: bash
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ (github.event_name == 'release' || inputs.publish) && github.ref_name || 'dev' }}
      EXE_SUFFIX: ${{ contains(matrix.target, 'windows') && '.exe' || '' }}
      # A static C runtime lets the Windows executable run without the Visual C++ redistributable.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml, then the target to build for.
      - run: rustup toolchain install && rustup target add "$TARGET"
      - name: Check the release tag matches the crate version
        if: github.event_name == 'release' || inputs.publish
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "quran-detect-cli") | .version')
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$TAG" != "v$version" ]; then
            echo "::error::Publishing requires the tag v$version"
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: notices
          path: target/release-notices
      - run: cargo build --release --locked --package quran-detect-cli --target "$TARGET"
      - name: Package
        run: |
          name="quran-detect-$VERSION-$TARGET"
          mkdir -p "$name/docs" dist
          cp "target/$TARGET/release/quran-detect$EXE_SUFFIX" README.md LICENSE \
            crates/quran-detect/THIRD-PARTY-NOTICES.md target/release-notices/THIRD-PARTY-LICENSES.txt "$name/"
          cp docs/cli.md docs/quran-detect.1 "$name/docs/"
          if [ "$RUNNER_OS" = Windows ]; then
            archive="$name.zip"
            7z a "dist/$archive" "$name"
          else
            archive="$name.tar.gz"
            tar -czf "dist/$archive" "$name"
          fi
          cd dist
          if [ "$RUNNER_OS" = macOS ]; then
            shasum -a 256 "$archive"
          else
            sha256sum "$archive"
          fi > "$archive.sha256"
          wc -c "$archive"
      - name: Smoke-test the extracted archive
        run: |
          name="quran-detect-$VERSION-$TARGET"
          extracted="$RUNNER_TEMP/extracted"
          mkdir -p "$extracted" "$RUNNER_TEMP/cwd"
          if [ "$RUNNER_OS" = Windows ]; then
            (cd dist && sha256sum --check "$name.zip.sha256")
            7z x "dist/$name.zip" "-o$extracted"
          else
            if [ "$RUNNER_OS" = macOS ]; then
              (cd dist && shasum -a 256 --check "$name.tar.gz.sha256")
            else
              (cd dist && sha256sum --check "$name.tar.gz.sha256")
            fi
            tar -xzf "dist/$name.tar.gz" -C "$extracted"
          fi
          bundle="$extracted/$name"
          for file in README.md LICENSE THIRD-PARTY-NOTICES.md THIRD-PARTY-LICENSES.txt docs/cli.md docs/quran-detect.1; do
            test -s "$bundle/$file"
          done
          version=$(cargo metadata --no-deps --locked --format-version 1 \
            | jq -r '.packages[] | select(.name == "quran-detect-cli") | .version')
          binary="$bundle/quran-detect$EXE_SUFFIX"
          cd "$RUNNER_TEMP/cwd"
          test "$("$binary" --version)" = "quran-detect $version"
          test "$("$binary" --text 'فيختم بقل هو الله أحد')" = 'فيختم بقُلْ هُوَ اللَّهُ أَحَدٌ'
          test "$(printf 'قل هو الله احد' | "$binary" -)" = 'قُلْ هُوَ اللَّهُ أَحَدٌ'
      - uses: actions/upload-artifact@v7
        with:
          name: quran-detect-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  upload:
    name: Attach to the release
    needs: build
    if: github.event_name == 'release' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          # Archives and checksums only; the notices are inside each archive.
          pattern: quran-detect-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
