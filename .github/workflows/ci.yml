name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests, dependencies, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain pinned in rust-toolchain.toml, with rustfmt and clippy.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: jdx/mise-action@v5.2.3
      - name: Check workspace versions and release-please dependency names
        run: |
          cargo metadata --no-deps --locked --format-version 1 \
            | jq -e '
              .packages as $packages |
              ([$packages[].version] | unique) as $versions |
              ($versions | length) == 1 and
              all($packages[].dependencies[] |
                  select(.path != null) |
                  select(.name as $name | any($packages[]; .name == $name));
                  .rename == null and .req == ("^" + $versions[0]))'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo deny --locked check
      - name: Check dependency notices
        run: cargo about generate --locked --all-features --workspace --fail about.hbs --output-file "$RUNNER_TEMP/THIRD-PARTY-LICENSES.txt"
      - run: actionlint
      - run: shellcheck scripts/cli-docs.sh
      - name: Check generated CLI reference
        run: |
          sh scripts/cli-docs.sh
          git diff --exit-code -- docs/
      - name: Check publishable packages
        run: cargo package --workspace --locked

  test:
    name: tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
